# MOD (quality of life; language): the evolution's and the tallies' skip hints, ours (not the game's), keyed so a text source can
# translate it (key main.QOL_STR_*). `storage: define`: a literal where src/main/mod_qol.c uses it.
MOD_QOL:
  storage: define
  strings:
    QOL_STR_SKIP_EVOLUTION:
      ja: "Press START to skip the animation"
      en_us: "Press START to skip the animation"
    QOL_STR_SKIP_COUNT: # △ is the Shift-JIS character of 81A2, the code the font draws as × (docs/mods/options.md)
      ja: "Press △ to skip"
      en_us: "Press △ to skip"
