# MOD (lab menu; text sources, docs/handoff/text-sources-design.md 2.9 E): the lab menu's own text, ours (not the game's),
# keyed so a text source can translate it (keys main.LAB_STR_*). `storage: define`: each is a literal where src/main/mod_lab.c
# uses it, as before (the same binary). The same text for every release.
MOD_LAB:
  storage: define
  strings:
    LAB_STR_TITLE:
      ja: "LAB MENU"
      en_us: "LAB MENU"
    LAB_STR_ADD_BITS:
