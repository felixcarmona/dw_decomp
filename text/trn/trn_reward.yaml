MESSAGES:
  strings:
    TRN_D_8008F0D8:
      ja: 「思いっきり！」
      en_us: Give it all you got!
    TRN_D_8008F0F0:
      ja: 「ほどほど！」
      en_us: Take it easy!
    TRN_D_8008F100:
      ja: 「はなれろ！」
      en_us: Get back!
    TRN_D_8008F10C:
      ja: 「ターゲット変更！」
      en_us: Change target!
    TRN_D_8008F11C:
      ja: 「ガマンだ！」
      en_us: Hang in there!
    TRN_D_8008F12C:
      ja: 「そうびした技」
      en_us: Technique mastered.
    TRN_D_8008F140:
      ja: の命令を聞くようになった！
      en_us: New orders!

MASTERED:
  strings:
    TRN_D_8008F19C:
      ja: をおぼえた。
      en_us: was mastered!

# MOD (training block): the box under the stats box when a block of sessions stops early (src/trn/trn_block.h).
# The 0 of TRN_BLOCK_DONE is replaced by the number of sessions done.
TRN_BLOCK_DONE:
  ja: 5回中0回 トレーニングした
  en_us: Trained 0 of 5 sessions.
TRN_BLOCK_HUNGRY:
  ja: おなかが すいている
  en_us: It is hungry.
TRN_BLOCK_TOILET:
  ja: トイレに 行きたがっている
  en_us: It needs the toilet.
TRN_BLOCK_SLEEPY:
  ja: ねむそうだ
  en_us: It is sleepy.
TRN_BLOCK_TIRED:
  ja: つかれている
  en_us: It is tired.
TRN_BLOCK_UNWELL:
  ja: ぐあいが わるい
  en_us: It is not well.
TRN_BLOCK_EVOLVE:
  ja: 進化しそうだ！
  en_us: It is about to digivolve!
TRN_BLOCK_LIFE:
  ja: 寿命が つきかけている
  en_us: Its life is ending.
